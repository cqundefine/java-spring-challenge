spring:
  application:
    name: kafka-task-challenge
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/task_challenge}
    username: ${DATABASE_USERNAME:task_user}
    password: ${DATABASE_PASSWORD:task_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: calculation-workers
      auto-offset-reset: earliest
      properties:
        spring.json.value.default.type: com.example.taskchallenge.task.CalculationTask
        spring.json.trusted.packages: com.example.taskchallenge.task
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
